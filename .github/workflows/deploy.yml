name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    # Cada lunes a primera hora: descarga las leyes actualizadas del BOE y vuelve a publicar
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: ¿Hay que descargar el BOE?
        id: decide
        run: |
          missing=$(python -c "import json,os; print(sum(1 for l in json.load(open('data/leyes.json'))['leyes'] if l.get('id') and not os.path.exists('data/boe/'+l['id']+'.json')))")
          if [ "${{ github.event_name }}" != "push" ] || [ "$missing" != "0" ]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          else
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar textos oficiales del BOE
        if: steps.decide.outputs.fetch == 'true'
        run: python scripts/fetch_boe.py
        continue-on-error: true

      - name: Guardar los textos actualizados en el repositorio
        if: steps.decide.outputs.fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boe
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza textos oficiales del BOE"
            git push
          fi

      - name: Generar la web
        run: python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
